name: Release

on:
  push:
    tags:
      - "node-sdk/v*"
      - "php-sdk/v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  npm:
    if: startsWith(github.ref, 'refs/tags/node-sdk/v')
    needs: checks
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Set package version from release tag
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#node-sdk/v}"
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Expected a stable release tag such as node-sdk/v1.2.3."
            exit 1
          fi
          npm version "$VERSION" --workspace=@unnits/unnisign-sdk --no-git-tag-version --ignore-scripts --allow-same-version
      - run: npm publish --workspace=@unnits/unnisign-sdk --access public --provenance

  composer:
    if: startsWith(github.ref, 'refs/tags/php-sdk/v')
    needs: checks
    runs-on: ubuntu-latest
    environment: composer
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Split PHP package and publish its version tag
        env:
          GH_TOKEN: ${{ secrets.PHP_SPLIT_TOKEN }}
          SPLIT_REPOSITORY: ${{ vars.PHP_SPLIT_REPOSITORY }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          test -n "$SPLIT_REPOSITORY"
          [[ "$SPLIT_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          VERSION="${GITHUB_REF_NAME#php-sdk/}"
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          SPLIT=$(git subtree split --prefix=packages/php-sdk "$GITHUB_SHA")
          git tag "$VERSION" "$SPLIT"
          gh auth setup-git
          git push --atomic "https://github.com/${SPLIT_REPOSITORY}.git" "$SPLIT:refs/heads/main" "refs/tags/$VERSION"
